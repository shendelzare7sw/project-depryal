name: CI

on:
  push:
    branches: [main, production-ready]
  pull_request:

jobs:
  check:
    name: Pint · Larastan · Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip, exif, intl, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (gaya kode)
        run: vendor/bin/pint --test

      - name: Larastan (analisis statis)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Pest (test otomatis)
        shell: bash
        run: |
          php artisan test --compact 2>&1 | tee pest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Ringkasan kegagalan sebagai anotasi (log job hanya bisa dibaca setelah login).
            ringkas=$(grep -E "FAIL|FAILED|Tests\|Failed asserting|Exception|Error|at tests/|\.php:[0-9]+" pest.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Pest gagal::${ringkas}"
          fi
          exit $status

      - name: CSS hasil build mutakhir (php artisan sikaset:css)
        run: |
          php artisan sikaset:css
          git diff --stat --exit-code public/css/app.css public/vendor/daisyui/daisyui.min.css || {
            echo "::error::Jalankan 'php artisan sikaset:css' lalu commit hasilnya"; exit 1; }

      - name: Aturan Emas — tidak ada <style>/<script> di view selain assets & PDF
        run: |
          if grep -rn "<style\|<script" resources/views | grep -v "assets.blade\|laporan/pdf"; then
            echo "::error::Ditemukan <style>/<script> di luar assets.blade.php / laporan/pdf"; exit 1
          fi
